name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Check, Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # This project is intentionally zero-dependency (no npm install needed).

      - name: Syntax check all modules
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/src/main.js
          echo "dist/ size: $(du -sh dist/ | cut -f1)"
