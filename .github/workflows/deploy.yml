name: Deploy to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: festas/cosmic-survivor
  SITE_URL: https://cs.festas-builds.com/

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Hetzner server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/deploy/cosmic-survivor
            cd /home/deploy/cosmic-survivor

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null

            cat > docker-compose.yml <<EOF
            services:
              cosmic-survivor:
                container_name: cosmic-survivor
                image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                restart: unless-stopped
                ports:
                  - "127.0.0.1:8200:80"
            EOF

            docker compose pull
            docker compose up -d
            docker logout ghcr.io
            docker image prune -af

            # Reload host nginx in case the reverse-proxy config changed.
            sudo nginx -t && sudo nginx -s reload

      - name: Smoke-test the live site
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.SITE_URL }}" || true)
          echo "Live site HTTP status: ${STATUS}"
          if [ "${STATUS}" != "200" ]; then
            echo "WARNING: site did not return 200 (got ${STATUS})."
          fi
