# Static serving for Cosmic Survivor (native ES modules — no bundler).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Correct MIME types for ES modules and the web manifest.
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json;
        application/manifest+json             webmanifest;
        image/svg+xml                         svg;
        image/png                             png;
        image/x-icon                          ico;
    }
    default_type application/octet-stream;

    # Compress text assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 512;

    # App shell: always revalidate so updates ship immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The service worker must never be cached, or clients get stuck on old versions.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Source/assets change on each deploy; short cache keeps things fresh.
    location ~* \.(?:js|mjs|css|svg|png|ico|webmanifest)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Everything resolves to a real file; fall back to the app shell otherwise.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
